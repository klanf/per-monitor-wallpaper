<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>stage</title>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<!-- 双图层舞台：结构与主窗口一致，但用 canvas 代替 <img> —— 原图在 JS 里降采样后
     画进 canvas（物理像素大小），常驻显存只有屏幕大小而不是图片原始大小。
     8K 图原始解码 ≈132MB，两层交叉淡入同时常驻 ≈264MB；canvas 4K ≈33MB/层。
     外层 .layer 管过渡（transform/opacity），内层 canvas 管 Ken Burns 缓动，
     两层 transform 独立、互不叠加。 -->
<div id="stage">
  <div class="layer" id="layerA"><canvas></canvas></div>
  <div class="layer" id="layerB"><canvas></canvas></div>
  <!-- 深度视差层（stage.js 按需创建 canvas 并填充）：有深度 sidecar 的图片走
       WebGL 视差渲染，盖在两个 2D 图层之上、时段滤镜之下。无深度时保持
       display:none，2D 路径行为与原来完全一致。 -->
  <canvas id="depthgl" style="position:absolute;inset:0;width:100%;height:100%;display:none;z-index:3;pointer-events:none;"></canvas>
  <!-- 粒子特效层（雨落/樱花/雪花/...）：盖在图层与视差层之上、时段滤镜之下 ——
       滤镜连粒子一起调色。pointer-events:none 不吃鼠标；由 stage.js 的 rAF gate
       块驱动，关 = display:none。z-index:4 高于视差层(3)。 -->
  <canvas id="particles" style="position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;"></canvas>
</div>
<script src="particles.js"></script>
<script src="stage.js"></script>
</body>
</html>
